<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GNU GRUB version 2.12</title>
  
  <!-- OpenGraph Meta Tags for proper embedding preview in Canva and other platforms -->
  <meta property="property" content="GNU GRUB 2.12 Menu">
  <meta property="og:title" content="GNU GRUB version 2.12">
  <meta property="og:type" content="website">

  <style>
    /* ==========================================================================
       1. MASTER CUSTOMIZATION CONSTANTS (GOVERNS COLORS & BACKGROUND)
       ========================================================================== */
    :root {
      /* Master text & border color (governs ALL text & borders on the screen) */
      --grub-text-color: #bfbfbf;
      --grub-border-color: var(--grub-text-color);

      /* Master background color in R, G, B (0, 0, 0 = pure black) */
      --grub-bg-rgb: 0, 0, 0;

      /* Background transparency from 0.0 (transparent) to 1.0 (solid) */
      --grub-bg-opacity: 1.0;

      /* Selected row highlight bar background & text colors */
      --grub-highlight-bg: #aaaaaa;
      --grub-highlight-text: #000000;
    }

    /* ==========================================================================
       2. GLOBAL RESET & PAGE CONTAINER
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    /* ==========================================================================
       3. THE 640x480 VGA GRUB SCREEN
       ========================================================================== */
    #grub-screen {
      width: 640px;
      height: 480px;
      background-color: rgba(var(--grub-bg-rgb), var(--grub-bg-opacity));
      position: relative;
      padding-top: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border: 1px solid #222;
      flex-shrink: 0;
    }

    /* Top header: "GNU GRUB  version 2.12" */
    .grub-title {
      color: var(--grub-text-color);
      font-size: 16px;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
      text-align: center;
      white-space: pre;
    }

    /* ==========================================================================
       4. THE BORDERED SELECTION BOX & MENU ROWS
       ========================================================================== */
    .grub-box {
      width: 598px;
      max-width: 94%;
      height: 294px;
      border: 2px solid var(--grub-border-color);
      padding: 4px 2px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .grub-box::-webkit-scrollbar {
      display: none;
    }

    /* Individual row inside the GRUB box */
    .grub-row {
      height: 20px;
      line-height: 20px;
      font-size: 16px;
      color: var(--grub-text-color);
      white-space: pre;
      cursor: pointer;
      padding-left: 2px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    /* Highlighted/active row */
    .grub-row.selected {
      background-color: var(--grub-highlight-bg);
      color: var(--grub-highlight-text);
    }

    /* ==========================================================================
       5. BOTTOM INSTRUCTIONS
       ========================================================================== */
    .grub-footer {
      width: 530px;
      max-width: 90%;
      margin-top: 32px;
      color: var(--grub-text-color);
      font-size: 15px;
      line-height: 1.25;
      white-space: pre-line;
    }
  </style>
</head>
<body>

  <!-- ==========================================================================
       6. MAIN 640x480 GNU GRUB TERMINAL MARKUP
       ========================================================================== -->
  <div id="grub-screen">
    <!-- Top Header -->
    <div class="grub-title">GNU GRUB  version 2.12</div>

    <!-- Bordered Menu Box -->
    <div class="grub-box" id="grub-menu-list" role="listbox" aria-label="GRUB Bootloader Menu"></div>

    <!-- Classic GRUB Footer Instructions -->
    <div class="grub-footer" id="grub-footer-text">Use the ↑ and ↓ keys to select which entry is highlighted.
Press enter to boot the selected OS, `e' to edit the commands
before booting or `c' for a command-line.</div>
  </div>

  <script>
    /* ==========================================================================
       6.5 MASTER CUSTOMIZATION CONSTANTS (GOVERNS ALL COLORS & BACKGROUND)
       ========================================================================== */
    const TEXT_COLOR           = "#bfbfbf"; // Governs ALL text and border colors across the screen
    const BG_RGB               = "0, 0, 0"; // Base background color in R, G, B (0, 0, 0 = pure black)
    const BG_OPACITY           = 1.0;       // Background transparency from 0.0 (transparent) to 1.0 (solid)
    const HIGHLIGHT_BG_COLOR   = "#aaaaaa"; // Highlighted selection bar background color
    const HIGHLIGHT_TEXT_COLOR = "#000000"; // Highlighted selection bar text color

    // Apply master constants to CSS variables
    document.documentElement.style.setProperty("--grub-text-color", TEXT_COLOR);
    document.documentElement.style.setProperty("--grub-border-color", TEXT_COLOR);
    document.documentElement.style.setProperty("--grub-bg-rgb", BG_RGB);
    document.documentElement.style.setProperty("--grub-bg-opacity", BG_OPACITY);
    document.documentElement.style.setProperty("--grub-highlight-bg", HIGHLIGHT_BG_COLOR);
    document.documentElement.style.setProperty("--grub-highlight-text", HIGHLIGHT_TEXT_COLOR);

    /* ==========================================================================
       7. MENU TREE DATA STRUCTURE (Collapsible categories and sub-items)
       ========================================================================== */
    const menuTree = [
      {
        title: "Music",
        expanded: false,
        children: ["Dheema", "Perfect", "Her"]
      },
      {
        title: "Projects",
        expanded: false,
        children: ["Terrain-Diffusion", "ThinkPad-Mods", "ESP32-RF-Tuner"]
      },
      {
        title: "Poems",
        expanded: false,
        children: ["Midnight-Drafts", "Static-Verse", "Unspoken"]
      },
      {
        title: "Books",
        expanded: false,
        children: ["Persepolis", "Dune", "Neuromancer"]
      },
      {
        title: "Random",
        expanded: false,
        children: ["Dotfiles", "Speedrun-Seeds", "Notes"]
      }
    ];

    /* ==========================================================================
       8. STATE VARIABLES & DOM REFERENCES
       ========================================================================== */
    let selectedIndex = 0; // Index of the currently highlighted row

    const menuContainer = document.getElementById("grub-menu-list");
    const footerEl      = document.getElementById("grub-footer-text");

    const defaultFooterText = `Use the ↑ and ↓ keys to select which entry is highlighted.
Press enter to boot the selected OS, \`e' to edit the commands
before booting or \`c' for a command-line.`;

    /* ==========================================================================
       9. FLATTEN TREE INTO CURRENTLY VISIBLE ROWS
       ========================================================================== */
    function getVisibleRows() {
      const rows = [];

      menuTree.forEach((category, catIdx) => {
        rows.push({
          type: "parent",
          label: category.title,
          catIdx: catIdx
        });

        if (category.expanded) {
          category.children.forEach((childName) => {
            rows.push({
              type: "child",
              label: ">" + childName,
              parentTitle: category.title,
              childTitle: childName,
              catIdx: catIdx
            });
          });
        }
      });

      return rows;
    }

    /* ==========================================================================
       10. RENDER THE GRUB MENU LIST
       ========================================================================== */
    function renderMenu() {
      menuContainer.innerHTML = "";
      const visibleRows = getVisibleRows();

      if (selectedIndex >= visibleRows.length) selectedIndex = visibleRows.length - 1;
      if (selectedIndex < 0) selectedIndex = 0;

      visibleRows.forEach((row, index) => {
        const rowEl = document.createElement("div");
        const isSelected = (index === selectedIndex);

        rowEl.className = "grub-row" + (isSelected ? " selected" : "");

        const prefix = isSelected ? "*" : " ";
        rowEl.textContent = prefix + row.label;

        rowEl.addEventListener("click", () => {
          selectedIndex = index;
          triggerRowAction(row);
        });

        menuContainer.appendChild(rowEl);
      });
    }

    /* ==========================================================================
       11. ROW ACTION HANDLER (EXPAND/COLLAPSE OR SELECT SUB-ITEM)
       ========================================================================== */
    function triggerRowAction(row) {
      if (row.type === "parent") {
        // Toggle category expansion
        menuTree[row.catIdx].expanded = !menuTree[row.catIdx].expanded;
        footerEl.textContent = defaultFooterText;
        renderMenu();
      } else if (row.type === "child") {
        // Show status message in footer without opening any pop-up pages
        footerEl.textContent = `Selected item: ${row.parentTitle} > ${row.childTitle}. Press Enter or click to boot.`;
        renderMenu();
      }
    }

    /* ==========================================================================
       12. KEYBOARD NAVIGATION
       ========================================================================== */
    window.addEventListener("keydown", (event) => {
      const visibleRows = getVisibleRows();

      if (event.key === "ArrowDown") {
        event.preventDefault();
        selectedIndex = (selectedIndex + 1) % visibleRows.length;
        renderMenu();
      } 
      else if (event.key === "ArrowUp") {
        event.preventDefault();
        selectedIndex = (selectedIndex - 1 + visibleRows.length) % visibleRows.length;
        renderMenu();
      } 
      else if (event.key === "Enter" || event.key === "ArrowRight") {
        event.preventDefault();
        const currentRow = visibleRows[selectedIndex];
        if (currentRow) {
          triggerRowAction(currentRow);
        }
      } 
      else if (event.key === "ArrowLeft") {
        event.preventDefault();
        const currentRow = visibleRows[selectedIndex];
        if (currentRow && currentRow.type === "child") {
          menuTree[currentRow.catIdx].expanded = false;
          const updatedRows = getVisibleRows();
          selectedIndex = updatedRows.findIndex(
            (r) => r.type === "parent" && r.catIdx === currentRow.catIdx
          );
          renderMenu();
        }
      }
    });

    // Initial render
    renderMenu();
  </script>
</body>
</html>
